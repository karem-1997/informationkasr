<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة بيانات مستشفى القصر العيني</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary: #1a5276; --secondary: #2980b9; --success: #27ae60; --danger: #c0392b; --accent: #f39c12; --bg: #d5d8dc; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); margin: 0; padding: 10px; direction: rtl; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .admin-box { background: #f4f9f4; border: 2px solid var(--success); padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; font-family: 'Tajawal'; box-sizing: border-box; }
        .data-card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 15px; margin-bottom: 10px; border-right: 6px solid var(--accent); position: relative; }
        .btn-group { display: flex; gap: 5px; margin-top: 10px; }
        .btn-sm { padding: 5px 10px; border-radius: 5px; border: none; cursor: pointer; color: white; font-size: 0.8rem; }
        .btn-edit { background: var(--accent); }
        .btn-del { background: var(--danger); }
        .notes-text { font-size: 0.85rem; color: #666; font-style: italic; margin-top: 5px; display: block; }
        
        /* Modal Style */
        .modal { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align:center; margin-bottom:20px;">
        <h1 style="color:var(--primary)">لوحة إدارة المواعيد المتطورة</h1>
    </header>

    <div id="panel-clinics" class="admin-box">
        <h3>إضافة/تعديل موعد دكتور</h3>
        <input type="text" id="c-doc" placeholder="اسم الدكتور">
        <input type="text" id="c-time" placeholder="الموعد (مثلاً: 9 ص - 1 م)">
        <input type="number" id="c-price" placeholder="سعر الكشف">
        <textarea id="c-notes" placeholder="ملاحظات عن الدكتور (اختياري)"></textarea>
        <button onclick="saveClinic()" style="background:var(--success); color:white; width:100%; padding:12px; border:none; border-radius:8px; font-weight:bold;">حفظ الموعد</button>
    </div>

    <div id="clinics-display-area">
        </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3>تعديل بيانات الدكتور</h3>
        <input type="text" id="edit-doc">
        <input type="text" id="edit-time">
        <input type="number" id="edit-price">
        <textarea id="edit-notes"></textarea>
        <div class="btn-group">
            <button onclick="confirmEdit()" style="background:var(--success); color:white; flex:1; padding:10px; border:none; border-radius:8px;">حفظ التعديلات</button>
            <button onclick="closeModal()" style="background:var(--bg); color:black; flex:1; padding:10px; border:none; border-radius:8px;">إلغاء</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDYW77Gt98QizE_x4o9qM_3PIRtZK1xRXw",
        authDomain: "informationkasr-d7f90.firebaseapp.com",
        projectId: "informationkasr-d7f90",
        storageBucket: "informationkasr-d7f90.firebasestorage.app",
        messagingSenderId: "183077060452",
        appId: "1:183077060452:web:647171df9af42d537e4471"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let state = { cats: [] };
    let cur = { cat: 0, dept: 0, day: "السبت" }; // قيم افتراضية للتجربة
    let editingIndex = null;

    async function loadData() {
        const doc = await db.collection("app").doc("data").get();
        if(doc.exists) { 
            state = doc.data(); 
            renderClinics(); 
        }
    }

    function renderClinics() {
        const div = document.getElementById('clinics-display-area');
        div.innerHTML = "<h3>المواعيد الحالية (للتعديل والحذف):</h3>";
        
        // عرض مواعيد أول قسم وعيادة كمثال للتحكم
        if(state.cats[0] && state.cats[0].depts[0]) {
            let dept = state.cats[0].depts[0];
            let dayClinics = dept.clinics[cur.day] || [];
            
            dayClinics.forEach((c, i) => {
                div.innerHTML += `
                    <div class="data-card">
                        <b>د. ${c.doc}</b><br>
                        <span>${c.time} | ${c.price} ج.م</span>
                        ${c.notes ? `<span class="notes-text">📝 ${c.notes}</span>` : ''}
                        <div class="btn-group">
                            <button class="btn-sm btn-edit" onclick="openEditModal(${i})"><i class="fas fa-edit"></i> تعديل</button>
                            <button class="btn-sm btn-del" onclick="deleteClinic(${i})"><i class="fas fa-trash"></i> حذف</button>
                        </div>
                    </div>
                `;
            });
        }
    }

    async function saveClinic() {
        let d = state.cats[cur.cat].depts[cur.dept];
        if(!d.clinics[cur.day]) d.clinics[cur.day] = [];
        
        d.clinics[cur.day].push({
            doc: document.getElementById('c-doc').value,
            time: document.getElementById('c-time').value,
            price: document.getElementById('c-price').value,
            notes: document.getElementById('c-notes').value
        });
        
        await db.collection("app").doc("data").set(state);
        renderClinics();
        alert("تم الحفظ بنجاح");
    }

    // وظائف التعديل
    function openEditModal(index) {
        editingIndex = index;
        let c = state.cats[cur.cat].depts[cur.dept].clinics[cur.day][index];
        document.getElementById('edit-doc').value = c.doc;
        document.getElementById('edit-time').value = c.time;
        document.getElementById('edit-price').value = c.price;
        document.getElementById('edit-notes').value = c.notes || "";
        document.getElementById('editModal').style.display = 'flex';
    }

    async function confirmEdit() {
        let c = state.cats[cur.cat].depts[cur.dept].clinics[cur.day][editingIndex];
        c.doc = document.getElementById('edit-doc').value;
        c.time = document.getElementById('edit-time').value;
        c.price = document.getElementById('edit-price').value;
        c.notes = document.getElementById('edit-notes').value;
        
        await db.collection("app").doc("data").set(state);
        closeModal();
        renderClinics();
    }

    async function deleteClinic(index) {
        if(confirm("هل أنت متأكد من حذف هذا الموعد؟")) {
            state.cats[cur.cat].depts[cur.dept].clinics[cur.day].splice(index, 1);
            await db.collection("app").doc("data").set(state);
            renderClinics();
        }
    }

    function closeModal() { document.getElementById('editModal').style.display = 'none'; }

    loadData();
</script>
</body>
</html>
